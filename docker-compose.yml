services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SERVE_PORT: 5058
    ports:
      - "5058:5058"
    volumes:
      - ./models:/app/models
      - ./src:/app/src
      - ./serve.py:/app/serve.py
    networks:
      - chessnet
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5058/').getcode()"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./devtools
      dockerfile: Dockerfile.frontend
    container_name: chess-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: "http://backend:5058"
      BACKEND_URL: "http://backend:5058"
      SERVE_PORT: 5058
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chessnet

networks:
  chessnet:
    driver: bridge
